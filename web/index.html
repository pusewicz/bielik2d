<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bielik2D demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #ddd; font-family: -apple-system, sans-serif; }
  #stage { display: grid; place-items: center; height: 100%; }
  canvas { width: min(80vw, 1280px); aspect-ratio: 16 / 9; display: block; background: #111; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
  #status { position: fixed; bottom: 12px; left: 12px; font-size: 12px; opacity: 0.7; font-variant-numeric: tabular-nums; }
  #title { position: fixed; top: 12px; left: 12px; font-size: 12px; opacity: 0.5; }
  #title a { color: inherit; text-decoration: none; border-bottom: 1px dotted; }
</style>
<script type="importmap">
{
  "imports": {
    "@bjorn3/browser_wasi_shim": "https://esm.sh/@bjorn3/browser_wasi_shim@0.3.0"
  }
}
</script>
</head>
<body>
<div id="title">Bielik2D web demo · <a href="https://github.com/pusewicz/bielik2d">source</a></div>
<div id="stage">
  <canvas id="bielik2d"></canvas>
</div>
<div id="status">loading…</div>
<script type="module">
  import { init } from "./index.js";
  const status = document.getElementById("status");
  if (!navigator.gpu) {
    status.textContent = "WebGPU not available. Try Chrome / Edge / Safari 18.2+.";
    throw new Error("WebGPU unavailable");
  }
  try {
    await init({});
    status.textContent = "running";
  } catch (e) {
    status.textContent = "error: " + e;
    throw e;
  }
</script>
</body>
</html>
