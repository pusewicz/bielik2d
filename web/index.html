<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bielik2D demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #ddd; font-family: -apple-system, sans-serif; }
  #stage { display: grid; place-items: center; height: 100%; }
  canvas { width: min(80vw, 1280px); height: min(45vw, 720px); display: block; background: #111; }
  #status { position: fixed; bottom: 12px; left: 12px; font-size: 12px; opacity: 0.7; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bielik2d"></canvas>
</div>
<div id="status">loading…</div>
<script type="module">
  // PackageToJS emits an entrypoint module that exports `init`. The exact
  // filename depends on the plugin version; both `app.js` and `index.js` are
  // in the wild.
  const candidates = ["./app.js", "./index.js"];
  let entry;
  for (const c of candidates) {
    try { entry = await import(c); break; } catch (e) { /* try next */ }
  }
  if (!entry) {
    document.getElementById("status").textContent =
        "couldn't locate PackageToJS entrypoint. Did build-web.sh finish?";
    throw new Error("missing PackageToJS entrypoint");
  }
  const { instantiate } = entry;
  try {
    await instantiate({});
    document.getElementById("status").textContent = "running";
  } catch (e) {
    document.getElementById("status").textContent = "error: " + e;
    throw e;
  }
</script>
</body>
</html>
